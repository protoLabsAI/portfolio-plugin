# Example TEAM TEMPLATE for portfolio_spinup_team.
#
# Point `portfolio.team_template` (or the tool's `template=` arg) at THIS directory.
# portfolio_spinup_team clones it into a scoped workspace (ADR 0041) and fills the
# per-spawn sentinels — so one template spawns a fresh, repo-bound engineering team
# with no hand-editing:
#
#     {{REPO}}       → the repo the team's board manages (the `repo` arg)
#     {{TEAM_NAME}}  → the team / board name (the `name` arg)
#     {{GATE}}       → the pre-PR gate command (the `gate` arg; empty = no gate)
#
# GATEWAY (v0.14+): leave `model.api_base` blank and portfolio_spinup_team fills it from
# the PM host's own resolved gateway — so a team inherits the PM's model with NO creds prep.
# Only set api_base / drop a secrets.yaml here if you want this team on a DIFFERENT gateway
# than the PM's. (The gateway key rides the PM's environment into the spawned team, so an
# env-only OPENAI_API_KEY reaches it too.) A sibling secrets.yaml — if present — is cloned
# alongside (copy secrets.example.yaml → secrets.yaml and fill it) for that per-team case.
# The team's plugins (project_board + delegates + coder) come from the bundle the host
# already has installed, or install them into the template dir's plugins/ first.

identity:
  name: "{{TEAM_NAME}}"

model:
  provider: openai
  name: protolabs/reasoning
  api_base: ""        # blank → INHERITS the PM host's gateway (set only for a per-team gateway)
  api_key: ""         # blank → the PM's OPENAI_API_KEY reaches the team via its environment
  temperature: 0.2

# Brain: `native` runs on the gateway model above. Switch to `acp:claude` (with the
# claude CLI installed + ANTHROPIC_MODEL=opus in the launch env) for an Opus brain.
agent_runtime: native

plugins:
  enabled: [delegates, project_board, coder]

# Coding agents the board's loop dispatches to (ACP) — BOTH supported coders, so the
# tier ladder below (project_board.coders) has somewhere to escalate to. workdir is
# bound to the repo.
delegates:
  - { name: proto, type: acp, command: proto, args: ["--acp"], workdir: "{{REPO}}", permissions: auto }
  # 'claude-code' is the adapter alias for the claude-agent-acp binary (takes no launch
  # args, unlike proto) — the same binary a Claude-brained team already runs, so it's
  # on PATH for free. Needs `npm i -g @agentclientprotocol/claude-agent-acp` otherwise.
  - { name: claude, type: acp, command: claude-code, workdir: "{{REPO}}", permissions: auto }

project_board:
  repo: "{{REPO}}"            # the repo the board manages; worktrees branch off it
  coders:                     # escalation ladder (model tier climbs smart → reasoning)
    smart: proto
    reasoning: claude
  loop_enabled: true          # auto-dispatch ready features (an ephemeral team should just run)
  local_gate_cmd: "{{GATE}}"  # pre-PR gate — the repo's real check command (empty = none)

# coder (ADR 0064) — the execution-grounded escalation: when a feature's EARS acceptance
# compiles to tests and the coders above still can't pass them, the board can search
# HARDER on a FIXED model — greedy → best-of-k → tree-search (refine on the failing
# tests) — gated on the tests actually passing, not an LLM judge. This is a different
# axis than the coders ladder above (which climbs model tier); the two compose. It runs
# MODEL-AUTHORED CODE in a subprocess (isolation, NOT a true sandbox, like execute_code)
# — enable only for a trusted model/host.
coder:
  delegate: proto   # candidate generator for the search ladder (reuse a delegate declared above)

# Fenced filesystem (ADR 0007): the team reads its repo + writes planning/grounding.
# allow_run stays false so a coder can't stall on a HITL shell prompt.
filesystem:
  enabled: true
  allow_run: false
  projects:
    - { name: "{{TEAM_NAME}}", path: "{{REPO}}", write: true }
