# OPTIONAL (v0.14+): you usually DON'T need this. portfolio_spinup_team inherits the PM
# host's gateway, and the PM's OPENAI_API_KEY reaches the team via its environment — so a
# team boots ready with no secrets file at all.
#
# Only use this for a team on a DIFFERENT gateway/key than the PM's: copy to secrets.yaml
# in this directory and fill it in — spinup clones it alongside langgraph-config.yaml into
# the spawned team's workspace. secrets.yaml is gitignored; never commit real keys.

OPENAI_API_KEY: ""   # a DIFFERENT gateway/model key for this team (else the PM's is used)
