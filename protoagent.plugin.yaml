id: portfolio
name: Portfolio (multi-team orchestration)
version: 0.6.0
description: >-
  The PM / program orchestration layer (ADR 0055 P1). One agent orchestrates work
  across MANY team-agents, each running its own project board for its own repo
  (scale-out). Pure composition of three existing subsystems — the fleet
  (team-agent registry), delegates (the A2A dispatch primitive), and project_board
  (the remote board read). The PM treats each remote fleet member as a *board*
  addressed by name: list them, dispatch a feature to one, read one back — over A2A.

  Tools: portfolio_boards (enumerate), portfolio_dispatch (send a feature to a
  team board over A2A), portfolio_board_read (structured read of one team board),
  portfolio_rollup (bounded cross-board view — per-board lane counts + only the
  blocked/critical-path items, so a PM reasons over MANY boards without raw reads),
  portfolio_diff (what changed since last check — merged/blocked/unblocked/new) +
  portfolio_watch (baseline now, then schedule a recurring diff — deltas without
  polling), portfolio_link (record a cross-board dependency — optionally a *planned
  dispatch* carrying the held work's spec) + portfolio_plan (the cross-board graph +
  what's ready to dispatch next; a link is satisfied when the depended-on feature
  merges→done) + portfolio_autodispatch (create each planned link's held work once its
  blocker ships — idempotent, schedulable). Ships DISABLED; enable
  with `plugins: { enabled: [portfolio] }`. Pairs with the `delegates` plugin and
  remote fleet members (ADR 0042). See ADR 0055.

  Team spawning (v0.6): portfolio_spinup_team stands up an EPHEMERAL team-agent on
  demand — it clones a base team config template into a scoped workspace (ADR 0041),
  binds a repo, starts the agent (ADR 0042 fleet supervisor) and registers it as a
  board, so a PM can spin teams up per project. portfolio_teardown_team disposes one;
  portfolio_autodispose closes the one-shot lifecycle (a team self-disposes once its
  board drains); portfolio_teams lists the spawned teams.

enabled: false
min_protoagent_version: "0.42.0"

# Config (ADR 0019) — defaults; a langgraph-config.yaml overlays them.
config:
  # Base team config for portfolio_spinup_team — a path to a langgraph-config.yaml (or its
  # config dir; a sibling secrets.yaml is cloned too). It carries the team's plugins
  # (project_board + delegates) and coder ladder; the {{REPO}} / {{TEAM_NAME}} / {{GATE}}
  # sentinels in it are filled per spawn. Leave empty to require an explicit template= arg.
  team_template: ""

# Declarative only (console transparency).
capabilities:
  network: ["*"]   # A2A dispatch + project_board reads to remote team-agents
  filesystem: ["~/.protoagent/workspaces/*"]  # spinup/teardown manage scoped team workspaces
